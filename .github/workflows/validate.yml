name: Validate Rider Hub
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: test -s index.html && test -s styles.css && test -s manifest.webmanifest
