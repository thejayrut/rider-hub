name: Validate Rider Hub
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check stable browser scripts
        run: |
          node --check stable-app.js
          node --check premium-polish.js
          node --check product-finish.js
          node --check banswara-trip-live.js
          node --check time-format-12h.js
          node --check account-scope-guard.js
          node --check motorcycle-catalog.js
          node --check manual-reader.js
          node --check cloud-drive-v2.js
          node --check sw.js
          cp stable-auth.js /tmp/stable-auth.mjs
          node --check /tmp/stable-auth.mjs

      - name: Run stable behavior smoke test
        run: node tests/stable-smoke.js

      - name: Validate stable runtime contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('stable-app.js','utf8');
          const premium=fs.readFileSync('premium-polish.js','utf8');
          const finish=fs.readFileSync('product-finish.js','utf8');
          const trip=fs.readFileSync('banswara-trip-live.js','utf8');
          const timeFmt=fs.readFileSync('time-format-12h.js','utf8');
          const css=fs.readFileSync('premium-polish.css','utf8');
          const tripCss=fs.readFileSync('banswara-trip-live.css','utf8');
          const drive=fs.readFileSync('cloud-drive-v2.js','utf8');
          const guard=fs.readFileSync('account-scope-guard.js','utf8');
          const auth=fs.readFileSync('stable-auth.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const rules=fs.readFileSync('firestore.rules','utf8');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          const required=['stable-app.css','stable-compat.css','premium-polish.css','banswara-trip-live.css','firebase-config.js','motorcycle-catalog.js','manual-reader.js','stable-app.js','cloud-drive-v2.js','premium-polish.js','account-scope-guard.js','product-finish.js','banswara-trip-live.js','time-format-12h.js','stable-auth.js'];
          for(const f of required) if(!html.includes(f)) throw new Error(`${f} missing from stable index`);
          for(const f of ['stable-ui-fixes.js','phase2e-restore.js','phase3-live.js','approved-changes.js','confirmed-features.js','ride-mode-v2.js','v32-fixes.js','firebase-auth.js']) if(html.includes(f)) throw new Error(`legacy runtime still loaded: ${f}`);
          if(!app.includes("ALLOWED_EMAIL='jayrut2006@gmail.com'")) throw new Error('private beta allowlist missing');
          if(!auth.includes("'jayrut2006@gmail.com'")) throw new Error('auth allowlist missing');
          if(!auth.includes('signInWithPopup(auth,provider())')||auth.includes('signInWithRedirect')||auth.includes('getRedirectResult')) throw new Error('stable Google sign-in must use direct popup flow');
          if(!auth.includes('browserLocalPersistence')||!auth.includes('enterFast')||!auth.includes('hydrateCloud')||!auth.includes('riderHubAuthReady')) throw new Error('local-first refresh auth missing');
          if(!auth.includes('riderHubCloudState')||!auth.includes('riderhub-cloud-state')) throw new Error('clear cloud sync state missing');
          if(!css.includes('.auth-pending .app{opacity:1}')||!css.includes('.auth-pending .auth-shell{display:none!important}')) throw new Error('fast visible app shell missing');
          if(!html.includes('class="auth-pending"')||!premium.includes('riderhub_onboarding_seen_v1')) throw new Error('onboarding refresh guard missing');
          if(!premium.includes('history.pushState')||!premium.includes("addEventListener('popstate'")) throw new Error('browser/Android back stack missing');
          if(!premium.includes('gearSearchChanged')||!premium.includes('renderGearResults')||premium.includes('gearSearchChanged=input=>{S().ui.gearQuery=input.value;save()')) throw new Error('focus-safe gear search missing');
          if(!rules.includes("request.auth.token.email == 'jayrut2006@gmail.com'")) throw new Error('Firestore allowlist missing');
          if(!guard.includes('isForeignScopedKey')||!guard.includes('removeForeignLocalFiles')) throw new Error('account-scoped private-file guard missing');
          if(!app.includes('Array.from({length:count}')||!app.includes('r.days.map')) throw new Error('dynamic ride-day model missing');
          if(!app.includes('function autoAdvance')||!app.includes('r.selectedDay=di+1')) throw new Error('automatic day advancing missing');
          for(const x of ['Map','Expenses','Fuel log','Notes','Packing','Emergency','Summary','Tomorrow','Edit day','Add task']) if(!premium.includes(`>${x}<`)&&!app.includes(`>${x}<`)) throw new Error(`Ride Mode tool missing: ${x}`);
          if(!premium.includes('ride-priority-actions')||!premium.includes('focus-progress')||!premium.includes('${pct}%')) throw new Error('Ride Mode priority/progress UX missing');
          if(!app.includes("travelmode:'two-wheeler'")) throw new Error('maps navigation missing');
          for(const x of ['openRideMenu','editRide','confirmDeleteRide','openRouteMenu','editRoutePart','confirmDeleteRoutePart','editRideTask','confirmDeleteRideTask']) if(!premium.includes(`window.${x}`)) throw new Error(`quiet ride editing control missing: ${x}`);
          for(const x of ["name:'Registration / RC'","name:'PUC / emissions'","name:'Purchase invoice'","name:'Warranty'","name:'Service invoices'",'+ Add custom document']) if(!premium.includes(x)) throw new Error(`document vault item missing: ${x}`);
          if(!premium.includes('syncAllLocalFilesToDrive')||!premium.includes('Cross-device sync')) throw new Error('Drive cross-device UX missing');
          for(const x of ['writeStateDrive','profile.drive','riderHubDriveRemembered','riderHubEnsureDriveAccess','riderHubReconnectDrive','desired:true','desired:false']) if(!drive.includes(x)) throw new Error(`persistent account Drive behavior missing: ${x}`);
          if(!finish.includes('Google Drive connected')||!finish.includes('Disconnect Drive')||!finish.includes('openPrivateDocumentFromDrive')) throw new Error('persistent Drive UI missing');
          if(!finish.includes('openRiderHubStatus')||!finish.includes('Offline cache')||!finish.includes('Saved offline')) throw new Error('Rider Hub health UX missing');
          if(!finish.includes('resumeRideModeId')||!finish.includes('Continue where you left off')) throw new Error('resume context missing');
          if(!finish.includes('Discard unsaved changes?')) throw new Error('unsaved-change protection missing');
          if(!premium.includes('navigator.onLine')||!premium.includes('Works offline')||!premium.includes('Needs internet')) throw new Error('online/offline status UX missing');
          if(!app.includes("purple|violet|lavender")||!app.includes("red|crimson|maroon")) throw new Error('single accent mapping missing');
          for(const text of ['Jayrut Gajjar','@jayrut.raw','@jayrut-raw','jayrut.raw@gmail.com']) if(!premium.includes(text)) throw new Error(`about detail missing: ${text}`);
          for(const text of ['Banswara 3-Day Ronin Monsoon Adventure','Hotel Landmark, Banswara','Chacha Kota Actual Boating Point','Mahi Dam, Banswara Rajasthan','Singpura Waterfall','Jagmeru Hills','Arthuna','START RETURN','EXIT OFF-ROAD SECTION','Godhra–Dahod','Safety overrides the schedule.','Unknown flowing water = RED.','Rider Hub real-world test']) if(!trip.includes(text)) throw new Error(`final Banswara trip item missing: ${text}`);
          for(const text of ['trip_banswara_guide','trip_banswara_hotel_booking','openBanswaraPrep','openSingpuraGoNoGo','openBanswaraOffroad','openBanswaraEmergency']) if(!trip.includes(text)) throw new Error(`Banswara live control missing: ${text}`);
          if(!tripCss.includes('.banswara-trip-panel')||!tripCss.includes('.banswara-mode-strip')||!tripCss.includes('.banswara-task-badge')) throw new Error('Banswara live trip styling missing');
          if(!timeFmt.includes('formatTime12')||!timeFmt.includes("hour>=12?'PM':'AM'")||!timeFmt.includes('MutationObserver')) throw new Error('12-hour AM/PM time formatter missing');
          if(!sw.includes("riderhub-stable-v41")||!sw.includes('product-finish.js')||!sw.includes('premium-polish.js')||!sw.includes('account-scope-guard.js')||!sw.includes('banswara-trip-live.js')||!sw.includes('banswara-trip-live.css')||!sw.includes('time-format-12h.js')) throw new Error('v41 service-worker cache missing');
          if(manifest.orientation!=='any') throw new Error('desktop-friendly PWA orientation missing');
          NODE

      - name: Validate configuration
        run: |
          node - <<'NODE'
          const fs=require('fs');
          JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          JSON.parse(fs.readFileSync('firebase.json','utf8'));
          JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          NODE

      - name: Keep Drive narrow and file-only
        run: |
          grep -Fq 'https://www.googleapis.com/auth/drive.file' cloud-drive-v2.js
          ! grep -Fq 'drive.appdata' cloud-drive-v2.js
          if grep -Eq 'riderhub_state_v1\.json|uploadState\(|downloadState\(' cloud-drive-v2.js; then
            echo 'Google Drive must not become a second app-state database.'
            exit 1
          fi

      - name: Reject private credentials
        run: |
          if grep -R -n --exclude-dir=.git -E 'BEGIN (RSA |EC |)PRIVATE KEY|"private_key"[[:space:]]*:|"client_secret"[[:space:]]*:' . 2>/dev/null; then
            echo 'Private credentials must never be committed.'
            exit 1
          fi
