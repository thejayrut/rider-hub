name: Validate Rider Hub
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check enhancements.js
      - run: node --check phase2e-restore.js
      - run: node --check maps-demo.js
      - run: node --check phase3-live.js
      - run: node --check phase3-account.js
      - run: node --check phase3-public.js
      - run: node --check state-bridge.js
      - run: node --check stability-hotfix.js
      - run: node --check firebase-ui-bridge.js
      - run: node --check motorcycle-catalog.js
      - run: node --check approved-changes.js
      - run: node --check approved-runtime-fixes.js
      - run: node --check manual-reader.js
      - run: node --check cloud-drive-v2.js
      - run: node --check confirmed-features.js
      - run: node --check auth-flow-controller.js
      - run: node --check sw.js
      - run: node tests/auth-flow-smoke.js
      - run: node tests/runtime-fixes-smoke.js
      - run: node tests/manual-reader-smoke.js
      - run: node tests/confirmed-features-smoke.js
      - name: Check Firebase module syntax
        run: |
          cp firebase-auth.js /tmp/firebase-auth.mjs
          node --check /tmp/firebase-auth.mjs
          cp firebase-account-delete.js /tmp/firebase-account-delete.mjs
          node --check /tmp/firebase-account-delete.mjs
      - name: Validate JSON configuration
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          JSON.parse(fs.readFileSync('firebase.json','utf8'));
          JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          const sizes=new Set((manifest.icons||[]).map(x=>x.sizes));
          if(!sizes.has('192x192')||!sizes.has('512x512')) throw new Error('PWA manifest needs 192x192 and 512x512 icons');
          if(!manifest.start_url||!manifest.display) throw new Error('PWA manifest is missing start_url/display');
          NODE
      - name: Check required app assets
        run: |
          test -s index.html
          test -s styles.css
          test -s phase2e-restore.css
          test -s phase3-live.css
          test -s phase3-account.css
          test -s firebase-account.css
          test -s approved-changes.css
          test -s confirmed-features.css
          test -s state-bridge.js
          test -s stability-hotfix.js
          test -s motorcycle-catalog.js
          test -s approved-changes.js
          test -s approved-runtime-fixes.js
          test -s manual-reader.js
          test -s cloud-drive-v2.js
          test -s confirmed-features.js
          test -s auth-flow-controller.js
          test -s firebase-account-delete.js
          test -s tests/auth-flow-smoke.js
          test -s tests/runtime-fixes-smoke.js
          test -s tests/manual-reader-smoke.js
          test -s tests/confirmed-features-smoke.js
          test -s icon-192.svg
          test -s icon-512.svg
          test -s icon-maskable.svg
          grep -Fq 'confirmed-features.css' index.html
          grep -Fq 'cloud-drive-v2.js' index.html
          grep -Fq 'manual-reader.js' index.html
          grep -Fq 'confirmed-features.js' index.html
          grep -Fq 'firebase-account-delete.js' index.html
          grep -Fq 'auth-flow-controller.js' index.html
          grep -Fq 'confirmed-features.js' sw.js
          grep -Fq "const CACHE='riderhub-v30'" sw.js
          ! grep -Fq '<script src="cloud-sync.js"></script>' index.html
      - name: Check confirmed UX contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const auth=fs.readFileSync('auth-flow-controller.js','utf8');
          const approved=fs.readFileSync('approved-changes.js','utf8');
          const runtime=fs.readFileSync('approved-runtime-fixes.js','utf8');
          const publicLayer=fs.readFileSync('phase3-public.js','utf8');
          const features=fs.readFileSync('confirmed-features.js','utf8');
          const drive=fs.readFileSync('cloud-drive-v2.js','utf8');
          const account=fs.readFileSync('firebase-account-delete.js','utf8');
          if((auth.match(/\{k:'/g)||[]).length!==3) throw new Error('Onboarding must have exactly three slides');
          if(!auth.includes('Continue with Google')) throw new Error('Google login action missing');
          if(!auth.includes('PRIVATE FILES STAY YOURS')||!auth.includes('your own Google Drive')) throw new Error('Drive privacy highlight missing from onboarding');
          const login=auth.slice(auth.indexOf('function renderLogin'),auth.indexOf('window.rhApprovedWelcomeBack'));
          if(/\bFirebase\b|\bFirestore\b|Google Sign-In is ready/.test(login)) throw new Error('Visible login copy exposes backend jargon');
          if(!approved.includes('removePrivateWorkspace')) throw new Error('Private Workspace removal missing');
          if(!approved.includes('GEAR GARAGE')||!approved.includes('Your riding inventory')) throw new Error('Approved Gear Garage missing');
          if(!approved.includes('Install as App')) throw new Error('Prominent install action missing');
          if(!approved.includes('removeTopAddRide')) throw new Error('Duplicate Add Ride removal missing');
          if(!features.includes("Add Owner's Manual")||!features.includes('Skip / do later')) throw new Error('Owner manual flow missing');
          if(!features.includes('Other manufacturers…')) throw new Error('Other manufacturer selector missing');
          if(!features.includes('+ Add custom document')) throw new Error('Custom document flow missing');
          if(!features.includes('purple|violet')||!features.includes('red|crimson')) throw new Error('Bike-colour accent mapping missing');
          if(!drive.includes('https://www.googleapis.com/auth/drive.file')||drive.includes('drive.appdata')) throw new Error('Drive must use narrow visible-file scope');
          if(!drive.includes("const ROOT_NAME='Rider Hub'")||!drive.includes("const MANUALS_NAME='Owner Manuals'")) throw new Error('Visible Rider Hub Drive folders missing');
          if(!account.includes('deleteUser(user)')) throw new Error('Account deletion missing');
          if(!runtime.includes('UserManual2026/TVS-Ronin.pdf')||!runtime.includes('hunter-350-dual-channel.pdf')) throw new Error('Verified owner manual links missing');
          if(!publicLayer.includes('bikeConfigured:false')||!publicLayer.includes('s.gear=[]')||!publicLayer.includes('USER_PREFIX')) throw new Error('Clean per-user workspace contract missing');
          NODE
      - name: Check self-service deletion rules
        run: |
          grep -Fq 'allow delete: if owns(userId);' firestore.rules
      - name: Reject obsolete runtime layers
        run: |
          test ! -e cloud-sync-fix.js
          test ! -e preview-mode.js
          ! grep -Eq 'cloud-sync-fix\.js|preview-mode\.js' index.html sw.js
      - name: Protect Firebase auth reserved namespace
        run: |
          grep -Fq "url.pathname.startsWith('/__/')" sw.js || {
            echo 'Service worker must never intercept Firebase Hosting /__/ auth helpers.'
            exit 1
          }
      - name: Keep Google Drive file-only
        run: |
          if grep -Eq 'riderhub_state_v1\.json|uploadState\(|downloadState\(' cloud-drive-v2.js; then
            echo 'Google Drive must not be a second Rider Hub app-state database.'
            exit 1
          fi
      - name: Reject non-Firebase Google API keys
        run: |
          if grep -R -n --exclude-dir=.git --exclude=firebase-config.js 'AIza[0-9A-Za-z_-]\{20,\}' . 2>/dev/null; then
            echo 'Non-Firebase Google API keys must stay device-local or server-side.'
            exit 1
          fi
      - name: Reject private credentials
        run: |
          if grep -R -n --exclude-dir=.git -E 'BEGIN (RSA |EC |)PRIVATE KEY|"private_key"[[:space:]]*:|"client_secret"[[:space:]]*:' . 2>/dev/null; then
            echo 'Private credentials must never be committed.'
            exit 1
          fi
