name: Validate Rider Hub
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check enhancements.js
      - run: node --check phase2e-restore.js
      - run: node --check maps-demo.js
      - run: node --check cloud-sync.js
      - run: node --check phase3-live.js
      - run: node --check phase3-account.js
      - run: node --check phase3-public.js
      - run: node --check state-bridge.js
      - run: node --check stability-hotfix.js
      - run: node --check firebase-ui-bridge.js
      - run: node --check motorcycle-catalog.js
      - run: node --check approved-changes.js
      - run: node --check approved-runtime-fixes.js
      - run: node --check auth-flow-controller.js
      - run: node --check sw.js
      - name: Check Firebase module syntax
        run: |
          cp firebase-auth.js /tmp/firebase-auth.mjs
          node --check /tmp/firebase-auth.mjs
      - name: Validate JSON configuration
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          JSON.parse(fs.readFileSync('firebase.json','utf8'));
          JSON.parse(fs.readFileSync('.firebaserc','utf8'));
          const sizes=new Set((manifest.icons||[]).map(x=>x.sizes));
          if(!sizes.has('192x192')||!sizes.has('512x512')) throw new Error('PWA manifest needs 192x192 and 512x512 icons');
          if(!manifest.start_url||!manifest.display) throw new Error('PWA manifest is missing start_url/display');
          NODE
      - name: Check required app assets
        run: |
          test -s index.html
          test -s styles.css
          test -s phase2e-restore.css
          test -s phase3-live.css
          test -s phase3-account.css
          test -s firebase-account.css
          test -s approved-changes.css
          test -s state-bridge.js
          test -s stability-hotfix.js
          test -s motorcycle-catalog.js
          test -s approved-changes.js
          test -s approved-runtime-fixes.js
          test -s auth-flow-controller.js
          test -s icon-192.svg
          test -s icon-512.svg
          test -s icon-maskable.svg
          grep -Fq 'approved-changes.css' index.html
          grep -Fq 'motorcycle-catalog.js' index.html
          grep -Fq 'approved-changes.js' index.html
          grep -Fq 'approved-runtime-fixes.js' index.html
          grep -Fq 'auth-flow-controller.js' index.html
          grep -Fq 'auth-flow-controller.js' sw.js
          grep -Fq "const CACHE='riderhub-v26'" sw.js
      - name: Check approved UX contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const auth=fs.readFileSync('auth-flow-controller.js','utf8');
          const approved=fs.readFileSync('approved-changes.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const catalog=fs.readFileSync('motorcycle-catalog.js','utf8');
          if((auth.match(/\{k:'/g)||[]).length!==3) throw new Error('Onboarding must have exactly three slides');
          if(!auth.includes('Continue with Google')) throw new Error('Google login action missing');
          if(/Everything around your Ronin|TVS RONIN · CHARCOAL EMBER/.test(auth)) throw new Error('Onboarding contains bike-specific branding');
          if(/Firebase|Firestore|Google Sign-In is ready/.test(auth)) throw new Error('Login/onboarding exposes backend jargon');
          if(!index.includes('RIDER HUB')||!index.includes('MOTORCYCLE OS')) throw new Error('Generic pre-login header missing');
          if(!index.includes('rh-bell-svg')) throw new Error('Bell icon missing from header');
          if(!approved.includes('Private Workspace') && !approved.includes('private workspace')) {
            // Removal is implemented by selector text; absence is okay only if the removal helper remains.
            if(!approved.includes('removePrivateWorkspace')) throw new Error('Private Workspace removal missing');
          }
          if(!approved.includes('GEAR GARAGE')||!approved.includes('Your riding inventory')) throw new Error('Approved Gear Garage missing');
          if(!approved.includes('Install as App')) throw new Error('Prominent install action missing');
          const more=approved.slice(approved.indexOf('window.renderMore=function'));
          if(!more.includes('Emergency contacts')||!more.includes('My Account')||!more.includes('Files & storage')) throw new Error('Required More actions missing');
          if(!approved.includes('removeTopAddRide')) throw new Error('Duplicate Add Ride removal missing');
          if(!catalog.includes('GetMakesForVehicleType/moto')||!catalog.includes('vehicletype/motorcycle')) throw new Error('Global motorcycle catalog lookup missing');
          if(!catalog.includes("'tvs|ronin'")||!catalog.includes("'royal enfield|hunter 350'")) throw new Error('Verified motorcycle profiles missing');
          NODE
      - name: Reject obsolete runtime layers
        run: |
          test ! -e cloud-sync-fix.js
          test ! -e preview-mode.js
          ! grep -Eq 'cloud-sync-fix\.js|preview-mode\.js' index.html sw.js
      - name: Protect Firebase auth reserved namespace
        run: |
          grep -Fq "url.pathname.startsWith('/__/')" sw.js || {
            echo 'Service worker must never intercept Firebase Hosting /__/ auth helpers.'
            exit 1
          }
      - name: Keep Google Drive file-only
        run: |
          if grep -Eq 'riderhub_state_v1\.json|uploadState\(|downloadState\(' cloud-sync.js; then
            echo 'Google Drive must not be a second Rider Hub app-state database.'
            exit 1
          fi
      - name: Reject non-Firebase Google API keys
        run: |
          if grep -R -n --exclude-dir=.git --exclude=firebase-config.js 'AIza[0-9A-Za-z_-]\{20,\}' . 2>/dev/null; then
            echo 'Non-Firebase Google API keys must stay device-local or server-side.'
            exit 1
          fi
      - name: Reject private credentials
        run: |
          if grep -R -n --exclude-dir=.git -E 'BEGIN (RSA |EC |)PRIVATE KEY|"private_key"[[:space:]]*:|"client_secret"[[:space:]]*:' . 2>/dev/null; then
            echo 'Private credentials must never be committed.'
            exit 1
          fi
