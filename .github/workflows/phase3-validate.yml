name: Validate Phase 3
on:
  push:
    branches: [ phase3 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -s src/components/RideDetailV2.tsx && test -s src/components/MorePage.tsx && test -s src/services/googleDriveSync.ts
      - name: Reject committed Google API keys
        run: |
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'AIza[0-9A-Za-z_-]\{20,\}' src docs .env.example 2>/dev/null; then
            echo 'A Google API key appears to be committed. Rider Hub keys must stay device-local.'
            exit 1
          fi
      - name: Enforce zero-cost baseline
        run: |
          if grep -q '"firebase"' package.json; then
            echo 'Firebase is not approved in the zero-cost baseline.'
            exit 1
          fi
