<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070809">
<meta name="color-scheme" content="dark">
<meta name="description" content="Rider Hub — your motorcycle companion">
<meta name="application-name" content="Rider Hub">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="stable-app.css">
<title>Rider Hub</title>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><div class="mark">RH</div><div><div class="brand-title">RIDER HUB</div><div class="brand-sub">MOTORCYCLE OS</div></div></div>
    <div class="header-actions"><span class="sync-dot" title="Local copy ready"></span><button class="iconbtn" onclick="openAccount()" aria-label="My Account">◉</button></div>
  </header>
  <main>
    <section id="home" class="page active"></section>
    <section id="bike" class="page"></section>
    <section id="rides" class="page"></section>
    <section id="gear" class="page"></section>
    <section id="more" class="page"></section>
  </main>
  <nav class="bottomnav">
    <button class="navbtn active" data-page="home" onclick="setPage('home')"><b>⌂</b><span>Home</span></button>
    <button class="navbtn" data-page="bike" onclick="setPage('bike')"><b>◇</b><span>Bike</span></button>
    <button class="ridebtn" onclick="setPage('rides')">↗</button>
    <button class="navbtn" data-page="gear" onclick="setPage('gear')"><b>▣</b><span>Gear</span></button>
    <button class="navbtn" data-page="more" onclick="setPage('more')"><b>•••</b><span>More</span></button>
  </nav>
</div>
<div id="modalWrap" class="modalwrap"><div id="modal" class="modal"></div></div>
<div id="rideMode" class="rideMode"><div id="rideModeInner" class="rideModeInner"></div></div>
<div id="toast" class="toast"></div>
<div id="authShell" class="auth-shell"><div class="auth-inner"><div class="auth-brand"><div class="mark">RH</div><div><div class="brand-title">RIDER HUB</div><div class="brand-sub">MOTORCYCLE OS</div></div></div><div id="authStage" class="auth-stage"></div></div></div>
<script src="firebase-config.js"></script>
<script src="motorcycle-catalog.js"></script>
<script src="manual-reader.js"></script>
<script src="stable-app.js"></script>
<script src="cloud-drive-v2.js"></script>
<script type="module" src="stable-auth.js"></script>
</body>
</html>
