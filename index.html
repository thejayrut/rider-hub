<style>
:root{--bg:#0d0f11;--panel:#15181b;--panel2:#1a1e22;--line:#2a2f34;--text:#f4f1ec;--muted:#a5a8aa;--ember:#f06a2a;--ember2:#ff8a45;--ok:#42c878;--warn:#f3b84b;--bad:#ef5b5b;--blue:#62a7ff;--r:18px;--shadow:0 14px 40px rgba(0,0,0,.28)}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(240,106,42,.08),transparent 28%),linear-gradient(180deg,#0c0e10 0%,#111417 100%);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:860px;margin:auto;min-height:100vh;padding:18px 16px 108px}.topo{position:fixed;inset:0;opacity:.045;pointer-events:none;background-image:repeating-radial-gradient(ellipse at 20% 10%,transparent 0 18px,#fff 19px 20px,transparent 21px 35px);mix-blend-mode:screen}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:23px;font-weight:800;letter-spacing:-.03em}.brand span{color:var(--ember)}.iconBtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(24,27,31,.88);color:var(--text);display:grid;place-items:center}.badge{position:absolute;margin:-4px 0 0 25px;background:var(--ember);color:#111;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:800}.card{background:linear-gradient(180deg,rgba(25,28,32,.98),rgba(19,22,25,.98));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.hero{padding:19px;background:linear-gradient(135deg,rgba(240,106,42,.12),rgba(22,25,28,.97) 40%);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;right:-60px;top:-90px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(240,106,42,.15);box-shadow:0 0 0 24px rgba(240,106,42,.025),0 0 0 48px rgba(240,106,42,.018)}.eyebrow{font-size:11px;color:var(--ember2);text-transform:uppercase;letter-spacing:.13em;font-weight:800}.hero h1,.hero h2{margin:5px 0 7px;line-height:1.08}.hero h1{font-size:30px}.hero h2{font-size:25px}.muted{color:var(--muted)}.tiny{font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#111417;border:1px solid var(--line);border-radius:15px;padding:13px}.metric b{font-size:19px;display:block;margin-top:4px}.sectionTitle{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#c7c7c7;font-weight:800;margin:22px 3px 10px}.btn{border:1px solid var(--line);background:#202428;color:var(--text);padding:11px 14px;border-radius:13px;font-weight:750}.btn.primary{background:var(--ember);border-color:var(--ember);color:#111}.btn.ok{background:var(--ok);border-color:var(--ok);color:#07130b}.btn.ghost{background:transparent}.btn.danger{background:rgba(239,91,91,.12);color:#ff9797;border-color:rgba(239,91,91,.35)}.btn.small{padding:8px 10px;font-size:12px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#111417;border:1px solid var(--line);font-size:12px;color:#d7d7d7}.pill.ok{color:#8de7b1;border-color:rgba(66,200,120,.35);background:rgba(66,200,120,.08)}.pill.warn{color:#ffd888;border-color:rgba(243,184,75,.35);background:rgba(243,184,75,.08)}.pill.bad{color:#ff9b9b;border-color:rgba(239,91,91,.35);background:rgba(239,91,91,.08)}.progress{height:12px;border-radius:999px;background:#0b0d0f;border:1px solid #262b30;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--ember2));border-radius:999px;transition:.25s}.timeline{display:flex;flex-direction:column;gap:9px}.task{display:grid;grid-template-columns:62px 32px 1fr auto;gap:8px;align-items:center;padding:11px 10px;border-radius:14px;background:#111417;border:1px solid var(--line)}.task.done{opacity:.62}.task.current{border-color:rgba(240,106,42,.65);box-shadow:inset 0 0 0 1px rgba(240,106,42,.13)}.task .time{font-size:12px;color:#b9b9b9}.check{width:28px;height:28px;border-radius:9px;border:1px solid #3a4047;background:#1d2125;color:#fff}.check.on{background:var(--ok);border-color:var(--ok);color:#07130b}.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tool{min-height:74px;text-align:left;border-radius:15px;border:1px solid var(--line);background:#111417;color:var(--text);padding:11px;font-weight:750}.tool small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.alert{border-radius:14px;padding:12px 13px;border:1px solid var(--line);background:#111417;margin-top:9px}.alert.warn{border-color:rgba(243,184,75,.4);background:rgba(243,184,75,.07)}.alert.bad{border-color:rgba(239,91,91,.42);background:rgba(239,91,91,.08)}.alert.ok{border-color:rgba(66,200,120,.35);background:rgba(66,200,120,.07)}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;width:min(92vw,700px);background:rgba(19,22,25,.95);backdrop-filter:blur(18px);border:1px solid #30353a;border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 18px 50px rgba(0,0,0,.45)}.nav button{border:0;background:transparent;color:#9fa2a5;padding:8px 4px;border-radius:14px;font-size:11px;font-weight:750}.nav button.active{color:#fff;background:#252a2f}.nav .ride{background:var(--ember);color:#111}.view{display:none}.view.active{display:block}.modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center}.modalWrap.open{display:flex}.modal{width:min(100%,780px);max-height:92vh;overflow:auto;background:#15181b;border:1px solid #343a40;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px rgba(0,0,0,.5)}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:sticky;top:-18px;background:#15181b;padding:18px 0 10px;z-index:2}.modal h3{margin:0}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:#bfc2c4}.field input,.field textarea,.field select{width:100%;background:#0f1214;border:1px solid #353b41;border-radius:12px;color:#fff;padding:11px}.field textarea{min-height:110px;resize:vertical}.list{display:flex;flex-direction:column;gap:9px}.listItem{padding:12px;border:1px solid var(--line);border-radius:14px;background:#111417}.footerBtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.rideMode{position:fixed;inset:0;z-index:45;background:linear-gradient(180deg,#0a0c0e,#121518);display:none;overflow:auto;padding:18px 16px 110px}.rideMode.open{display:block}.rideModeInner{max-width:780px;margin:auto}.rmTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.rmNow{font-size:30px;font-weight:850;letter-spacing:-.04em}.routeLine{line-height:1.55;font-size:13px;color:#d4d4d4}.kpi{font-weight:850;font-size:22px}.sep{height:1px;background:var(--line);margin:13px 0}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#252a2f;color:#fff;border:1px solid #3b4249;border-radius:999px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:600px){.app{padding:14px 12px 105px}.grid3{grid-template-columns:1fr}.toolgrid{grid-template-columns:1fr 1fr}.task{grid-template-columns:52px 30px 1fr}.task .btn{grid-column:3/5}.hero h1{font-size:26px}.nav{width:calc(100% - 16px);bottom:8px}.metric b{font-size:17px}}@media(min-width:700px){.toolgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="topo"></div><div class="toast" id="toast"></div>
<main class="app">
<div class="topbar"><div class="brand">Rider <span>Hub</span></div><button class="iconBtn" onclick="openNotifications()">🔔<span class="badge" id="alertBadge">1</span></button></div>
<section id="home" class="view active"></section>
<section id="bike" class="view"></section>
<section id="gear" class="view"></section>
<section id="rides" class="view"></section>
<section id="docs" class="view"></section>
</main>
<nav class="nav" id="nav"><button data-view="home" class="active" onclick="go('home')">Home</button><button data-view="bike" onclick="go('bike')">Bike</button><button class="ride" onclick="go('rides')">Rides</button><button data-view="gear" onclick="go('gear')">Gear</button><button data-view="docs" onclick="go('docs')">Docs</button></nav>
<div class="modalWrap" id="modalWrap"><div class="modal" id="modal"></div></div>
<div class="rideMode" id="rideMode"><div class="rideModeInner" id="rideModeInner"></div></div>
<script>
const HOME='3G7X+FJ2, Gaurav Path, Shastrinagar, Naranpura, Ahmedabad, Gujarat 380063';
const HOTEL='Hotel Landmark, College Road, Opp. COCO Petrol Pump, Banswara, Rajasthan 327001';
const KEY='riderhub_charcoal_ember_v3';
const base={bike:{name:'TVS Ronin',trim:'Mid • Charcoal Ember • 2026',odo:3200,service:{first:{km:767,date:'19 Jun 2026',amount:1000},nextKm:5500,nextDate:'07 Dec 2026'},chainLast:3000},ride:{id:'banswara-2026',title:'Banswara 3-Day Ronin Adventure',dates:'28–30 Aug 2026',selectedDay:1,hotelPaid:2470,highTarget:7170,expenses:{hotel:{label:'Hotel',amount:2470,confirmed:true},fuel:{label:'Fuel',amount:0,confirmed:true},food:{label:'Food',amount:0,confirmed:true},tolls:{label:'Tolls / parking',amount:0,confirmed:true},other:{label:'Other',amount:0,confirmed:true}},notes:'',fuelLogs:[],issues:[],content:{departure:false,mangarh:false,chacha:false,mahi:false,singhpura:false,jagmer:false,arthuna:false,arrival:false},backup:{action5:false,phone:false,favourites:false,booking:true},packing:{rain:false,firstaid:false,puncture:false,tools:false,power:false,docs:false,water:false,drysocks:false},customEmergency:['','',''],tasks:{}},ui:{}};
const days={
1:{date:'2026-08-28',title:'Ahmedabad → Banswara',route:[HOME,'Odhav, Ahmedabad','Kuha, Gujarat','Haldharvas, Gujarat','Ladvel, Gujarat','Balasinor, Gujarat','Lunawada, Gujarat','Santrampur, Gujarat','Khedapa, Rajasthan','Mangarh Dham, Rajasthan','Anandpuri, Rajasthan',HOTEL],tasks:[['05:30','Wake + light food'],['06:15','Depart Home'],['08:00','Breakfast + comfort break'],['11:00','Mangarh Dham'],['13:30','Hotel Landmark check-in'],['15:00','Rest / hydrate'],['17:00','Anand Sagar + Kalpavriksha'],['18:15','Kagdi Pick Up Weir'],['19:00','Dialab Lake · optional'],['20:30','Dinner'],['21:30','Fuel + Saturday prep'],['22:30','Sleep']]},
2:{date:'2026-08-29',title:'Banswara Adventure Loop',route:[HOTEL,'Chacha Kota, Rajasthan','Mahi Bajaj Sagar Dam, Rajasthan','Ghatol, Rajasthan','Singhpura Falls, Rajasthan',HOTEL],tasks:[['05:15','Wake + quick prep'],['05:45','Depart for Chacha Kota'],['06:30','Chacha Kota dawn'],['08:30','Mahi Bajaj Sagar Dam'],['10:00','Breakfast'],['11:30','Singhpura Falls via Ghatol'],['14:30','Return to Banswara'],['16:00','Rest'],['18:30','Flexible evening'],['21:30','Tomorrow prep']]},
3:{date:'2026-08-30',title:'Banswara → Ahmedabad',route:[HOTEL,'Jagmer / Jagmeru, Rajasthan',HOTEL,'Arthuna, Rajasthan','Khedapa, Rajasthan','Santrampur, Gujarat','Lunawada, Gujarat','Balasinor, Gujarat','Ladvel, Gujarat','Kuha, Gujarat','Odhav, Ahmedabad',HOME],tasks:[['05:15','Light luggage + Jagmer prep'],['05:45','Jagmer / Jagmeru session'],['08:15','Return to hotel'],['09:00','Breakfast + pack'],['10:15','Checkout'],['11:30','Arthuna'],['13:00','Depart for Ahmedabad'],['16:00','Break + hydrate'],['19:30','Ahmedabad approach'],['20:15','Arrive Home']]}}
function clone(x){return JSON.parse(JSON.stringify(x))}let state=load();function load(){try{return merge(clone(base),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return clone(base)}}function merge(a,b){if(!b||typeof b!=='object')return a;Object.keys(b).forEach(k=>{if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]});return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('#nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));renderAll();window.scrollTo({top:0,behavior:'instant'})}
function actualSpent(){return Object.values(state.ride.expenses).reduce((s,x)=>s+(x.confirmed?Number(x.amount||0):0),0)}function completed(day){let d=days[day];return d.tasks.filter((_,i)=>state.ride.tasks[day+'-'+i]?.status==='done').length}function pct(day){return Math.round(completed(day)/days[day].tasks.length*100)}function chainKm(){return Math.max(0,state.bike.odo-state.bike.chainLast)}
function renderHome(){let d=state.ride.selectedDay;document.getElementById('home').innerHTML=`<div class="card hero" onclick="go('bike')"><div class="eyebrow">My motorcycle</div><h1>${state.bike.name}</h1><div class="muted">${state.bike.trim}</div><div class="grid2" style="margin-top:15px"><div class="metric"><span class="tiny muted">Odometer</span><b>${state.bike.odo.toLocaleString()} km</b></div><div class="metric"><span class="tiny muted">Chain since lube</span><b>${chainKm()} km</b></div></div><div class="tiny muted" style="margin-top:10px">Motorcycle image intentionally removed for a cleaner Home screen.</div></div><div class="sectionTitle">Upcoming ride</div><div class="card" onclick="go('rides')"><div class="row between"><div><b>Banswara 3-Day Ronin Adventure</b><div class="tiny muted">28–30 Aug 2026 · 2 riders</div></div><span class="pill">Day ${d}</span></div><div style="margin-top:13px" class="progress"><i style="width:${pct(d)}%"></i></div><div class="row between tiny muted" style="margin-top:7px"><span>${pct(d)}% selected day complete</span><span>${completed(d)}/${days[d].tasks.length} tasks</span></div></div><div class="sectionTitle">Needs attention</div><div class="card"><div class="row between"><div><b>Chain care</b><div class="tiny muted">Custom reminder window: 400–500 km</div></div><span class="pill ${chainKm()>=500?'bad':chainKm()>=400?'warn':'ok'}">${chainKm()} km</span></div><div class="sep"></div><div class="row between"><div><b>Second service</b><div class="tiny muted">5,500–6,000 km or 07 Dec 2026 · whichever first</div></div><span class="pill">${Math.max(0,5500-state.bike.odo)} km</span></div></div>`}
function renderBike(){document.getElementById('bike').innerHTML=`<div class="card hero"><div class="eyebrow">My motorcycle</div><h1>TVS Ronin</h1><div class="muted">Mid • Charcoal Ember • 2026</div></div><div class="grid2"><div class="card"><div class="tiny muted">Master odometer</div><div class="kpi">${state.bike.odo.toLocaleString()} km</div><button class="btn small" onclick="editOdo()">Update</button></div><div class="card"><div class="tiny muted">Braking</div><div class="kpi" style="font-size:18px">Dual-Channel ABS</div></div></div><div class="sectionTitle">Maintenance</div><div class="card"><b>Chain clean + lube</b><div class="muted tiny">Manufacturer source: every 500 km · Rider Hub reminder starts at 400 km</div><div style="margin-top:12px" class="progress"><i style="width:${Math.min(100,chainKm()/5)}%"></i></div><div class="row between" style="margin-top:10px"><span>${chainKm()} km since last service</span><button class="btn small ok" onclick="markChain()">Mark serviced</button></div></div><div class="card"><b>Service history</b><div class="sep"></div><div class="row between"><span>1st Free Service · 19 Jun 2026</span><b>767 km</b></div><div class="tiny muted">Oil + filter · ${money(1000)}</div></div>`}
function renderGear(){let owned=['LS2 FF800 Storm II Helmet','Solace Furious V4.0 Touring Jacket','SMK Typhoon (Mom)','Tarmac Drifter II Level 2 Jacket (Mom)','EJEAS Q8 Mesh Intercom ×2','ViaTerra LEH 70L Saddlebags','Rynox Optimus 3 Tank Bag 21L','Aoocci C3 Pro 5″ Smart Screen','Portronics Vayu 5.0 Tyre Inflator'];let planned=['ViaTerra Grid MK3 Gloves','Solace Coolpro Sus V4T Mesh Pants','Solace XT Evo Pro boots','Solace V2.0 Rain Over Gloves','Solace Water Bladder','ViaTerra Holeshot Short gloves (Mom)','ViaTerra Miller Women’s Mesh Pants (Mom)','Raida Tourer Boots (Mom)'];document.getElementById('gear').innerHTML=`<div class="card hero"><div class="eyebrow">Gear Garage</div><h1>Ride-ready inventory</h1><div class="muted">Owned and planned gear kept separate.</div></div><div class="sectionTitle">Owned</div><div class="card list">${owned.map(x=>`<div class="listItem row between"><span>${x}</span><span class="pill ok">Owned</span></div>`).join('')}</div><div class="sectionTitle">Planned</div><div class="card list">${planned.map(x=>`<div class="listItem row between"><span>${x}</span><span class="pill">Planned</span></div>`).join('')}</div>`}
function renderDocs(){document.getElementById('docs').innerHTML=`<div class="card hero"><div class="eyebrow">Document Vault</div><h1>Private ride documents</h1><div class="muted">Sensitive identifiers stay masked by default.</div></div><div class="card list"><div class="listItem"><b>Insurance</b><div class="tiny muted">ICICI Lombard · OD to 04 Jun 2027 · TP to 04 Jun 2031</div></div><div class="listItem"><b>Learner licence</b><div class="tiny muted">Valid 02 Jun–01 Dec 2026</div></div><div class="listItem"><b>Vehicle invoice</b><div class="tiny muted">10 Jun 2026 · ${money(150340)}</div></div><div class="listItem"><b>Hotel Landmark booking</b><div class="tiny muted">28–30 Aug 2026 · 2 nights · ${money(2470)} paid</div></div></div>`}
async function renderRides(){let d=state.ride.selectedDay,p=pct(d),spent=actualSpent(),remain=state.ride.highTarget-spent;document.getElementById('rides').innerHTML=`<div class="card hero"><div class="eyebrow">Upcoming ride</div><h1>Banswara 3-Day Ronin Adventure</h1><div class="muted">28–30 Aug 2026 · TVS Ronin · 2 riders</div><div class="row wrap" style="margin-top:13px"><span class="pill">Home → Banswara → Home</span><span class="pill">Day ${d}: ${days[d].title}</span></div></div><div class="card" id="conditions"><div class="row between"><div><div class="eyebrow">Ride conditions</div><b>Weather + priority alerts</b></div><span class="pill" id="weatherStatus">Loading…</span></div><div class="grid3" style="margin-top:11px"><div class="metric"><span class="tiny muted">Current</span><b id="wTemp">—</b><span class="tiny muted" id="wDesc">Banswara</span></div><div class="metric"><span class="tiny muted">Rain chance</span><b id="wRain">—</b><span class="tiny muted">selected day</span></div><div class="metric"><span class="tiny muted">Road status</span><b style="font-size:16px">Provider not connected</b><span class="tiny muted">no fake closure data</span></div></div><div id="weatherAlert" class="alert">Checking forecast…</div></div><div class="card"><div class="row between"><div><div class="eyebrow">Today / selected day</div><b>${days[d].title}</b></div><b>${p}%</b></div><div class="progress" style="margin-top:11px"><i style="width:${p}%"></i></div><div class="row between tiny muted" style="margin-top:7px"><span>${completed(d)} completed</span><span>${days[d].tasks.length-completed(d)} remaining</span></div></div><div class="card"><div class="row between"><div><div class="eyebrow">Stay confirmed</div><b>Hotel Landmark, Banswara</b><div class="tiny muted">28–30 Aug · Deluxe Room · Room Only · ${money(2470)} paid</div></div><span class="pill ok">Paid</span></div><div class="row wrap" style="margin-top:12px"><button class="btn" onclick="bookingModal()">Open booking</button><button class="btn" onclick="openHotelMap()">Map</button></div></div><div class="card"><div class="row between wrap"><div><div class="eyebrow">Choose day</div><b>${days[d].date.split('-').reverse().join(' / ')}</b></div><div class="row">${[1,2,3].map(x=>`<button class="btn small ${x===d?'primary':''}" onclick="chooseDay(${x})">Day ${x}</button>`).join('')}</div></div></div><div class="sectionTitle">This day schedule</div><div class="card"><div class="timeline">${taskHtml(d)}</div></div><div class="sectionTitle">Trip toolkit</div><div class="card"><div class="toolgrid">${tool('💳','Expenses','Confirm before spend counts','expenses')}${tool('📝','Notes','Autosaved ride notes','notes')}${tool('⛽','Fuel log','Odo · litres · amount','fuel')}${tool('⚠️','Bike issue','Severity + odometer','issue')}${tool('🎬','Content','Shot checklist','content')}${tool('☁️','Media backup','Action 5 + phone','backup')}${tool('🎒','Packing','Trip essentials','packing')}${tool('🌅','Tomorrow','Next-day first tasks','tomorrow')}${tool('🆘','Emergency','Location + contacts','emergency')}${tool('🚦','Traffic','In-app traffic status','traffic')}${tool('↕️','Export / Import','Local backup','transfer')}${tool('📊','Ride Summary','Progress + spend','summary')}</div></div><button class="btn primary" style="width:100%;padding:15px" onclick="openRideMode()">Open Ride Mode</button><div class="sectionTitle">Ride summary</div><div class="grid3"><div class="metric"><span class="tiny muted">Actual spent</span><b>${money(spent)}</b></div><div class="metric"><span class="tiny muted">High target</span><b>${money(state.ride.highTarget)}</b></div><div class="metric"><span class="tiny muted">Remaining</span><b>${money(remain)}</b></div></div>`;loadWeather()}
function tool(icon,title,sub,key){return `<button class="tool" onclick="openTool('${key}')">${icon} ${title}<small>${sub}</small></button>`}function taskHtml(d){return days[d].tasks.map((t,i)=>{let s=state.ride.tasks[d+'-'+i]?.status||'';return `<div class="task ${s==='done'?'done':''}"><span class="time">${t[0]}</span><button class="check ${s==='done'?'on':''}" onclick="toggleTask(${d},${i})">${s==='done'?'✓':''}</button><div><b>${t[1]}</b>${s==='delayed'?`<div class="tiny" style="color:var(--warn)">Delayed ${state.ride.tasks[d+'-'+i].mins||15} min</div>`:''}${s==='skip'?'<div class="tiny muted">Skipped</div>':''}</div></div>`}).join('')}
function chooseDay(d){state.ride.selectedDay=d;save();renderAll()}function toggleTask(d,i){let k=d+'-'+i;state.ride.tasks[k]={status:state.ride.tasks[k]?.status==='done'?'':'done'};save();renderAll()}function editOdo(){modal('Update master odometer',`<div class="field"><label>Current odometer (km)</label><input id="odoDraft" type="number" value="${state.bike.odo}"></div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn ok" onclick="confirmOdo()">✓ Confirm</button>`)}function confirmOdo(){let n=Number(document.getElementById('odoDraft').value);if(!Number.isFinite(n)||n<0)return toast('Enter a valid odometer');state.bike.odo=n;save();closeModal();renderAll()}function markChain(){state.bike.chainLast=state.bike.odo;save();renderAll();toast('Chain service recorded')}
let modalScroll=0;function modal(title,body,footer=''){modalScroll=window.scrollY;document.getElementById('modal').innerHTML=`<div class="modalHead"><h3>${title}</h3><button class="iconBtn" onclick="closeModal()">✕</button></div>${body}<div class="footerBtns">${footer||`<button class="btn" onclick="closeModal()">Close</button>`}</div>`;document.getElementById('modalWrap').classList.add('open')}function closeModal(){document.getElementById('modalWrap').classList.remove('open');requestAnimationFrame(()=>window.scrollTo({top:modalScroll,behavior:'instant'}))}document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});
function openTool(k){({expenses:expenseModal,notes:notesModal,fuel:fuelModal,issue:issueModal,content:contentModal,backup:backupModal,packing:packingModal,tomorrow:tomorrowModal,emergency:emergencyModal,traffic:trafficModal,transfer:transferModal,summary:summaryModal})[k]?.()}
function expenseModal(){let draft=clone(state.ride.expenses);let body=`<div class="grid3"><div class="metric"><span class="tiny muted">Actual spent</span><b>${money(actualSpent())}</b></div><div class="metric"><span class="tiny muted">High target</span><b>${money(state.ride.highTarget)}</b></div><div class="metric"><span class="tiny muted">Remaining</span><b>${money(state.ride.highTarget-actualSpent())}</b></div></div><div class="alert">Amounts below are drafts until you press the green ✓ Confirm button.</div>${Object.entries(draft).map(([k,x])=>`<div class="field"><label>${x.label}</label><input class="expenseDraft" data-k="${k}" type="number" min="0" value="${x.amount}"></div>`).join('')}`;modal('Expenses',body,`<button class="btn" onclick="closeModal()">Close</button><button class="btn ok" onclick="confirmExpenses()">✓ Confirm</button>`)}function confirmExpenses(){document.querySelectorAll('.expenseDraft').forEach(i=>{state.ride.expenses[i.dataset.k].amount=Number(i.value||0);state.ride.expenses[i.dataset.k].confirmed=true});save();closeModal();renderAll();toast('Expenses confirmed')}
function notesModal(){modal('Ride notes',`<div class="field"><label>Notes</label><textarea id="notesDraft">${esc(state.ride.notes)}</textarea></div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn ok" onclick="confirmNotes()">✓ Confirm</button>`)}function confirmNotes(){state.ride.notes=document.getElementById('notesDraft').value;save();closeModal();toast('Notes saved')}
function fuelModal(){modal('Fuel log',`<div class="field"><label>Odometer</label><input id="fuelOdo" type="number" value="${state.bike.odo}"></div><div class="grid2"><div class="field"><label>Litres</label><input id="fuelL" type="number" step=".01"></div><div class="field"><label>Amount</label><input id="fuelAmt" type="number"></div></div><div class="tiny muted">This log is saved only after confirmation. If odometer is higher than the bike master reading, the master odometer advances.</div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn ok" onclick="confirmFuel()">✓ Confirm</button>`)}function confirmFuel(){let odo=Number(fuelOdo.value),l=Number(fuelL.value),a=Number(fuelAmt.value);if(!(odo>=0&&l>0&&a>=0))return toast('Enter valid fuel details');state.ride.fuelLogs.push({odo,l,a,at:new Date().toISOString()});if(odo>state.bike.odo)state.bike.odo=odo;state.ride.expenses.fuel.amount=Number(state.ride.expenses.fuel.amount||0)+a;save();closeModal();renderAll();toast('Fuel log confirmed')}
function issueModal(){modal('Bike issue',`<div class="field"><label>Severity</label><select id="issueSev"><option>Low</option><option>Medium</option><option>High</option></select></div><div class="field"><label>Issue</label><textarea id="issueTxt"></textarea></div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn ok" onclick="confirmIssue()">✓ Confirm</button>`)}function confirmIssue(){if(!issueTxt.value.trim())return toast('Describe the issue');state.ride.issues.push({severity:issueSev.value,text:issueTxt.value.trim(),odo:state.bike.odo,at:new Date().toISOString(),day:state.ride.selectedDay});save();closeModal();toast('Issue logged')}
function checks(obj,labels,fn){return labels.map(([k,l])=>`<label class="listItem row"><input type="checkbox" ${obj[k]?'checked':''} onchange="${fn}('${k}',this.checked)"><span>${l}</span></label>`).join('')}function contentModal(){let x=[['departure','Departure'],['mangarh','Mangarh Dham'],['chacha','Chacha Kota'],['mahi','Mahi Dam'],['singhpura','Singhpura Falls'],['jagmer','Jagmer / Jagmeru'],['arthuna','Arthuna'],['arrival','Home arrival']];modal('Content tracker',`<div class="list">${checks(state.ride.content,x,'setContent')}</div>`)}function setContent(k,v){state.ride.content[k]=v;save()}function backupModal(){let x=[['action5','Action 5 footage backed up'],['phone','Phone media backed up'],['favourites','Favourite photos selected'],['booking','Booking saved offline']];modal('Media backup',`<div class="list">${checks(state.ride.backup,x,'setBackup')}</div>`)}function setBackup(k,v){state.ride.backup[k]=v;save()}function packingModal(){let x=[['rain','Rain gear'],['firstaid','First aid + ORS'],['puncture','Puncture kit + inflator'],['tools','Tools'],['power','Power / charging'],['docs','Documents'],['water','Water + snacks'],['drysocks','Dry socks / walking footwear']];modal('Packing',`<div class="list">${checks(state.ride.packing,x,'setPacking')}</div>`)}function setPacking(k,v){state.ride.packing[k]=v;save()}function tomorrowModal(){let d=Math.min(3,state.ride.selectedDay+1);modal('Tomorrow',`<div class="alert"><b>Day ${d}: ${days[d].title}</b></div><div class="list">${days[d].tasks.slice(0,4).map(t=>`<div class="listItem"><b>${t[0]}</b> · ${t[1]}</div>`).join('')}</div>${d===2?'<div class="alert warn">Terrain rule: GREEN/YELLOW/ORANGE/RED. Turn around for unsafe water or technical sections.</div>':''}`)}
function emergencyModal(){modal('Emergency',`<div class="grid2"><a class="btn danger" href="tel:112">Call 112</a><a class="btn danger" href="tel:108">Call 108</a></div><button class="btn" style="width:100%;margin-top:10px" onclick="shareLocation()">Share Current Location</button><div id="locState" class="alert">Location permission will be requested when you tap Share Current Location.</div><div class="sectionTitle">Custom emergency contacts</div>${[0,1,2].map(i=>`<div class="field"><label>Emergency contact ${i+1}</label><input id="ec${i}" placeholder="Name / number" value="${esc(state.ride.customEmergency[i]||'')}"></div>`).join('')}`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn ok" onclick="saveEmergency()">✓ Save contacts</button>`)}function saveEmergency(){state.ride.customEmergency=[ec0.value,ec1.value,ec2.value];save();closeModal();toast('Emergency contacts saved')}async function shareLocation(){let box=document.getElementById('locState');if(!navigator.geolocation){box.className='alert bad';box.innerHTML='Geolocation is not supported here. Open your map app and share your location manually.';return}box.className='alert';box.textContent='Requesting location permission…';navigator.geolocation.getCurrentPosition(async p=>{let url=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;box.className='alert ok';box.innerHTML=`Location ready. <button class="btn small" onclick="navigator.clipboard.writeText('${url}').then(()=>toast('Location link copied'))">Copy share link</button>`;if(navigator.share){try{await navigator.share({title:'My current location',text:'My current location',url})}catch(e){}}},e=>{box.className='alert bad';let msg=e.code===1?'Location permission is denied. Enable location permission for this site in your browser settings, then tap Share Current Location again.':e.code===2?'Your location is temporarily unavailable. Check GPS/network and retry.':'Location request timed out. Retry in an open area.';box.textContent=msg},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
function trafficModal(){let d=state.ride.selectedDay;modal('Traffic',`<div class="alert warn"><b>Live traffic provider is not connected in this preview.</b><div class="tiny muted" style="margin-top:5px">Rider Hub will not pretend static estimates are live data and will not redirect you to Google Maps from this Traffic tool.</div></div><div class="list"><div class="listItem"><b>Current route</b><div class="tiny muted">${days[d].title}</div></div><div class="listItem"><b>Planning guidance · not live</b><div class="tiny muted">Expect denser traffic around Ahmedabad city approaches during commuter periods. Rural segments can still slow suddenly in monsoon conditions.</div></div><div class="listItem"><b>Connected-data design</b><div class="tiny muted">When a traffic provider is added, this panel will show route-segment congestion, delay minutes and time-based warnings in-app.</div></div></div>`)}
function transferModal(){modal('Export / Import',`<div class="row wrap"><button class="btn" onclick="exportData()">Export JSON backup</button><label class="btn">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div><div class="tiny muted" style="margin-top:10px">Useful while this preview stores data locally. Later, Firebase sync can replace manual transfer.</div>`)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='rider-hub-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=merge(clone(base),JSON.parse(r.result));save();closeModal();renderAll();toast('Backup imported')}catch(err){toast('Invalid backup file')}};r.readAsText(f)}
function summaryModal(){let d=state.ride.selectedDay;let c=Object.values(state.ride.content).filter(Boolean).length,b=Object.values(state.ride.backup).filter(Boolean).length;modal('Ride Summary',`<div class="grid3"><div class="metric"><span class="tiny muted">Day progress</span><b>${pct(d)}%</b></div><div class="metric"><span class="tiny muted">Actual spent</span><b>${money(actualSpent())}</b></div><div class="metric"><span class="tiny muted">Fuel logs</span><b>${state.ride.fuelLogs.length}</b></div></div><div class="list" style="margin-top:12px"><div class="listItem row between"><span>Bike issues</span><b>${state.ride.issues.length}</b></div><div class="listItem row between"><span>Content captured</span><b>${c}/8</b></div><div class="listItem row between"><span>Media backup</span><b>${b}/4</b></div></div>`)}
function bookingModal(){modal('Hotel Landmark Booking',`<div class="list"><div class="listItem"><b>${HOTEL}</b></div><div class="listItem">28–30 Aug 2026 · 2 nights · 2 adults</div><div class="listItem">Deluxe Room · 1 Double Bed · Room Only</div><div class="listItem row between"><span>Paid</span><b>${money(2470)}</b></div><div class="listItem">Free cancellation until 28 Aug 2026 11:59 AM</div></div>`)}function openHotelMap(){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(HOTEL),'_blank')}
function routeUrl(d){let r=days[d].route;let origin=encodeURIComponent(r[0]),dest=encodeURIComponent(r[r.length-1]),wp=r.slice(1,-1).map(encodeURIComponent).join('%7C');return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving&waypoints=${wp}`}function openRoute(d){window.open(routeUrl(d),'_blank')}
function nextTask(d){let i=days[d].tasks.findIndex((_,i)=>state.ride.tasks[d+'-'+i]?.status!=='done'&&state.ride.tasks[d+'-'+i]?.status!=='skip');return i<0?days[d].tasks.length-1:i}function openRideMode(){let d=state.ride.selectedDay;document.getElementById('rideMode').classList.add('open');renderRideMode()}function closeRideMode(){document.getElementById('rideMode').classList.remove('open');renderAll()}function renderRideMode(){let d=state.ride.selectedDay,i=nextTask(d),t=days[d].tasks[i];rideModeInner.innerHTML=`<div class="rmTop"><div><div class="eyebrow">Ride Mode · Day ${d}</div><div class="rmNow">${t[0]} · ${t[1]}</div></div><button class="iconBtn" onclick="closeRideMode()">✕</button></div><div class="card"><div class="row between"><b>Day progress</b><b>${pct(d)}%</b></div><div class="progress" style="margin-top:9px"><i style="width:${pct(d)}%"></i></div></div><div class="grid3"><button class="btn ok" onclick="rmSet('done')">✓ Done</button><button class="btn" onclick="rmDelay()">Delay</button><button class="btn danger" onclick="rmSet('skip')">Skip</button></div><div class="sectionTitle">Pre-ride checks</div><div class="card list"><label class="listItem"><input type="checkbox"> Helmet + visor</label><label class="listItem"><input type="checkbox"> Tyres + pressure visual check</label><label class="listItem"><input type="checkbox"> Rain layer accessible</label><label class="listItem"><input type="checkbox"> Pillion comfort + hydration check</label></div><div class="toolgrid"><button class="tool" onclick="openRoute(${d})">🗺️ Map<small>Full detailed waypoint route</small></button><button class="tool" onclick="expenseModal()">💳 Expenses<small>Confirm to save</small></button><button class="tool" onclick="emergencyModal()">🆘 Emergency<small>Location + contacts</small></button><button class="tool" onclick="summaryModal()">📊 Ride Summary<small>Progress + spend</small></button></div><div class="sectionTitle">Full route</div><div class="card routeLine">${days[d].route.map((x,j)=>`${j+1}. ${esc(x)}`).join('<br>')}</div><div class="sectionTitle">Day timeline</div><div class="card"><div class="timeline">${taskHtml(d)}</div></div>`}function rmSet(status){let d=state.ride.selectedDay,i=nextTask(d);state.ride.tasks[d+'-'+i]={status};save();renderRideMode()}function rmDelay(){let mins=Number(prompt('Delay this task by how many minutes?','15')||15);let d=state.ride.selectedDay,i=nextTask(d);state.ride.tasks[d+'-'+i]={status:'delayed',mins};save();renderRideMode()}
async function loadWeather(){let status=document.getElementById('weatherStatus');if(!status)return;let d=state.ride.selectedDay;try{let url='https://api.open-meteo.com/v1/forecast?latitude=23.5461&longitude=74.4349&current=temperature_2m,weather_code,precipitation&daily=precipitation_probability_max,precipitation_sum,weather_code&timezone=Asia%2FKolkata&forecast_days=16';let res=await fetch(url);if(!res.ok)throw Error();let w=await res.json();let idx=w.daily.time.indexOf(days[d].date);let rain=idx>=0?w.daily.precipitation_probability_max[idx]:null;let sum=idx>=0?w.daily.precipitation_sum[idx]:null;wTemp.textContent=Math.round(w.current.temperature_2m)+'°C';wDesc.textContent='Current Banswara';wRain.textContent=rain==null?'Forecast window unavailable':rain+'%';status.textContent='Live weather';status.className='pill ok';let box=document.getElementById('weatherAlert');if(rain!=null&&rain>=70||sum!=null&&sum>=15){box.className='alert bad';box.innerHTML='<b>High rain risk.</b> Reassess waterfall/off-road blocks and water crossings before riding. This is weather-derived guidance, not a road-closure claim.'}else if(rain!=null&&rain>=40){box.className='alert warn';box.innerHTML='<b>Rain possible.</b> Keep wet-weather backup routing ready and reassess technical sections.'}else{box.className='alert ok';box.innerHTML='<b>No severe weather signal from the connected forecast.</b> Road-closure data is not connected, so verify locally before departure.'}}catch(e){status.textContent='Offline';status.className='pill warn';document.getElementById('weatherAlert').className='alert warn';document.getElementById('weatherAlert').textContent='Weather could not load. Core ride tools still work offline.'}}
function openNotifications(){let alerts=[];if(chainKm()>=400)alerts.push('Chain care reminder: '+chainKm()+' km since last service.');alerts.push('Banswara ride: road-closure provider is not connected; weather alerting is available when online.');modal('Notifications',`<div class="list">${alerts.map(x=>`<div class="listItem">${x}</div>`).join('')}</div>`)}function renderAll(){renderHome();renderBike();renderGear();renderDocs();if(document.getElementById('rides').classList.contains('active'))renderRides()}renderAll();
</script>
</body></html>
