<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Rider Hub — personal motorcycle operating system">
<meta name="application-name" content="Rider Hub">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(()=>{
  const root=document.documentElement;root.classList.add('rh-preboot');
  try{
    const session=JSON.parse(localStorage.getItem('riderhub_auth_session_v1')||'null');
    const uid=session?.provider==='firebase'&&session?.uid?session.uid:'';
    const key=uid?'riderhub_public_state_v1_'+encodeURIComponent(uid):'';
    const saved=key?JSON.parse(localStorage.getItem(key)||'null'):null;
    const c=saved?.ui?.accentColor;
    if(/^#[0-9a-f]{6}$/i.test(String(c||''))){
      const n=parseInt(c.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
      root.style.setProperty('--ember',c);root.style.setProperty('--ember2',c);root.style.setProperty('--soft',`rgba(${r},${g},${b},.11)`);root.style.setProperty('--rh-accent',c);
    }
  }catch{}
  setTimeout(()=>root.classList.remove('rh-preboot'),1600);
})();
</script>
<style>html.rh-preboot body{visibility:hidden}</style>
