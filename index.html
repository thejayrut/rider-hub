async function loadWeather(){if(currentPage!=='rideDetail')return;const d=day(),[lat,lon]=d.coords;try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,precipitation,rain,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=Asia%2FKolkata&forecast_days=16`;const x=await fetch(url).then(r=>r.json()),idx=x.daily.time.indexOf(['2026-08-28','2026-08-29','2026-08-30'][state.ride.selectedDay-1]);const cur=x.current,prob=idx>=0?x.daily.precipitation_probability_max[idx]:null,sum=idx>=0?x.daily.precipitation_sum[idx]:null,max=idx>=0?x.daily.temperature_2m_max[idx]:null,min=idx>=0?x.daily.temperature_2m_min[idx]:null;weatherTitle.textContent=`Current ${weatherCode(cur.weather_code)} • expected ${max!=null?Math.round(max)+'° / '+Math.round(min)+'°':'forecast pending'}`;weatherTemp.textContent=Math.round(cur.temperature_2m)+'°';weatherSub.textContent=`Rain now ${cur.rain||0} mm • wind ${Math.round(cur.wind_speed_10m||0)} km/h${prob!=null?' • Day rain chance '+prob+'%':''}`;if(prob>=70||sum>=20){roadAlert.className='alertbox bad';roadAlert.textContent=`MONSOON ALERT • ${prob}% rain chance${sum!=null?' • '+sum+' mm expected':''}. Waterlogging or temporary route blocks are possible. Verify road status before departure and turn around at unsafe water.`}else if(prob>=40||sum>=8){roadAlert.className='alertbox warn';roadAlert.textContent=`RAIN CAUTION • ${prob}% rain chance. Keep optional stops flexible. Verified road-closure data is not connected.`}else{roadAlert.className='alertbox';roadAlert.textContent='Weather risk currently looks manageable. Verified road-closure data is not connected, so check local conditions before departure.'}}catch(e){weatherTitle.textContent='Weather service unavailable';weatherTemp.textContent='—°';weatherSub.textContent='Reconnect to load current and expected weather.';roadAlert.textContent='No road-status feed available while offline.'}}function weatherCode(c){return({0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm'}[c]||'Mixed')}
function dirUrl(points){const p=points.map(encodeURIComponent);return`https://www.google.com/maps/dir/?api=1&origin=${p[0]}&destination=${p[p.length-1]}&waypoints=${p.slice(1,-1).join('%7C')}&travelmode=driving`}function openRoute(){const d=day();openModal(`<div class="modal-head"><div><div class="kicker">DETAILED ROUTE</div><h3>Day ${state.ride.selectedDay} map sequence</h3><p>Every stop from the ride plan is kept in order. Long days are split into map segments so Google does not silently drop waypoints.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="route-list">${d.route.map((x,i)=>`<div class="route-stop"><span class="stopno">${i+1}</span><span>${esc(x)}</span></div>`).join('')}</div><div class="tool-actions">${d.segments.map((s,i)=>`<button class="secondary" onclick="window.open('${dirUrl(s)}','_blank','noopener')">Open segment ${i+1}</button>`).join('')}</div>`)}function openHotelMap(){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(HOTEL),'_blank','noopener')}function openBooking(){const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to open booking');w.document.write(`<title>Hotel Landmark Booking</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:30px;max-width:720px;margin:auto}h1{color:#f0a12b}.box{border:1px solid #333;border-radius:18px;padding:18px;margin:12px 0}b{color:#fff}small{color:#aaa}</style><h1>Hotel Landmark Booking</h1><div class="box"><b>Hotel Landmark, Banswara</b><p>${HOTEL}</p><p>28–30 Aug 2026 • 2 nights • 2 adults</p><p>Deluxe Room • 1 Double Bed • Room Only</p><p><b>₹2,470 paid</b></p><small>Free cancellation until 28 Aug 2026, 11:59 AM.</small></div>`);w.document.close()}
function openTool(type){if(type==='expenses')return openExpenses();if(type==='notes')return openNotes();if(type==='fuel')return openFuel();if(type==='issue')return openIssue();if(type==='content')return checklistModal('CONTENT','Shot tracker','content',[['departure','Departure / bike launch'],['mangarh','Mangarh'],['chacha','Chacha Kota'],['mahi','Mahi Dam'],['singhpura','Singhpura Falls'],['jagmer','Jagmer / Jagmeru'],['arthuna','Arthuna'],['arrival','Arrival / ending odo']]);if(type==='backup')return checklistModal('MEDIA SAFETY','Media backup','backup',[['action5','Action 5 footage copied'],['phone','Phone media backed up'],['photos','Favourite photos selected'],['booking','Booking details saved offline']]);if(type==='packing')return checklistModal('PACKING','Trip inventory','packing',[['rain','Rain gear + waterproof bags'],['firstaid','First-aid + ORS'],['puncture','Puncture kit + inflator'],['tools','Basic tools'],['power','Power bank + charging cables'],['documents','DL / RC / insurance / PUC'],['water','Water + snacks'],['socks','Dry socks / walking footwear']]);if(type==='tomorrow')return openTomorrow();if(type==='emergency')return openEmergency();if(type==='traffic')return openTraffic();if(type==='transfer')return openTransfer();return openSummary()}
function openModal(html){modalScroll=window.scrollY;modal.innerHTML=`<div class="grab"></div>${html}`;modalWrap.classList.add('open');document.body.style.overflow='hidden'}function closeModal(){modalWrap.classList.remove('open');document.body.style.overflow='';requestAnimationFrame(()=>window.scrollTo(0,modalScroll))}
function openExpenses(){expenseDraft={...state.ride.expenses};const rows=[['hotel','Hotel','Confirmed stay'],['fuel','Fuel','Petrol / top-ups'],['food','Food','Meals + snacks'],['parking','Parking / water','Small ride costs'],['misc','Miscellaneous','Other trip spend']];openModal(`<div class="modal-head"><div><div class="kicker">TRIP MONEY</div><h3>Expenses</h3><p>Amounts stay as a draft until you press the green ✓ Confirm button.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-summary"><div class="tool-tile"><label>ACTUAL SPENT</label><b id="draftSpent">${MONEY(spent())}</b></div><div class="tool-tile"><label>HIGH TARGET</label><b>₹7,170</b></div><div class="tool-tile"><label>REMAINING</label><b id="draftRemaining">${MONEY(Math.max(0,remaining()))}</b></div></div><div class="tool-list" style="padding:0 12px">${rows.map(r=>`<div class="tool-money-row"><label><b>${r[1]}</b><span>${r[2]}</span></label><input inputmode="decimal" value="${expenseDraft[r[0]]||''}" placeholder="₹0" oninput="draftExpense('${r[0]}',this.value)"></div>`).join('')}</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="confirmExpenses()">✓ Confirm</button></div>`)}function draftExpense(k,v){expenseDraft[k]=Math.max(0,Number(v)||0);const s=Object.values(expenseDraft).reduce((a,n)=>a+(Number(n)||0),0);draftSpent.textContent=MONEY(s);draftRemaining.textContent=s<=7170?MONEY(7170-s):MONEY(s-7170)+' over'}function confirmExpenses(){state.ride.expenses={...expenseDraft};save();closeModal();render();toast('Expenses confirmed')}
function openNotes(){openModal(`<div class="modal-head"><div><div class="kicker">AUTOSAVE</div><h3>Ride notes</h3><p>Notes save locally as you type.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="field"><textarea oninput="state.ride.notes=this.value;save()" placeholder="Road condition, hotel note, tomorrow reminder…">${esc(state.ride.notes)}</textarea></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="closeModal();toast('Notes saved')">✓ Done</button></div>`)}function openFuel(){const logs=state.ride.fuelLogs.slice().reverse();openModal(`<div class="modal-head"><div><div class="kicker">FUEL LOG</div><h3>Fuel stop</h3><p>Save explicitly. A newer odometer can advance the master bike odometer.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="field"><label>ODOMETER KM</label><input id="fOdo" type="number" value="${state.bike.odo}"></div><div class="field"><label>LITRES</label><input id="fLitres" type="number" step="0.01" placeholder="0.00"></div><div class="field"><label>AMOUNT ₹</label><input id="fAmount" type="number" step="0.01" placeholder="0"></div><div class="tool-list" style="padding:0 12px">${logs.length?logs.map(x=>`<div class="tool-log"><b>${x.date} • ${x.odo.toLocaleString('en-IN')} km</b><span>${x.litres||0} L • ${MONEY(x.amount)}</span></div>`).join(''):'<div class="empty">No fuel stops recorded.</div>'}</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="confirmFuel()">✓ Save fuel</button></div>`)}function confirmFuel(){const odo=Math.round(Number(fOdo.value)),litres=Number(fLitres.value)||0,amount=Number(fAmount.value)||0;if(!Number.isFinite(odo)||odo<0)return alert('Check the odometer.');state.ride.fuelLogs.push({date:new Date().toLocaleDateString(),odo,litres,amount});state.ride.expenses.fuel+=amount;if(odo>state.bike.odo){state.bike.odo=odo;state.bike.odoUpdated='Fuel log • '+new Date().toLocaleDateString()}save();closeModal();render();toast('Fuel stop saved')}
function openIssue(){openModal(`<div class="modal-head"><div><div class="kicker">BIKE LOG</div><h3>Bike issue</h3><p>Keep small issues attached to the ride so they are not forgotten.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="field"><label>ISSUE</label><input id="issueText" placeholder="Noise, loose strap, puncture, warning light…"></div><div class="field"><label>SEVERITY</label><select id="issueSev"><option>Monitor</option><option>Needs attention</option><option>Stop riding</option></select></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="confirmIssue()">✓ Save issue</button></div>`)}function confirmIssue(){if(!issueText.value.trim())return alert('Add the issue.');state.ride.issues.push({note:issueText.value.trim(),severity:issueSev.value,odo:state.bike.odo,date:new Date().toLocaleString()});save();closeModal();render();toast('Bike issue saved')}
function checklistModal(kicker,title,group,items){openModal(`<div class="modal-head"><div><div class="kicker">${kicker}</div><h3>${title}</h3></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-list">${items.map(([k,l])=>`<div class="tool-row"><div><strong>${esc(l)}</strong><small>Tap when complete</small></div><button class="tool-check ${state.ride[group][k]?'checked':''}" onclick="toggleCheck('${group}','${k}',this)">✓</button></div>`).join('')}</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="closeModal();render();toast('Checklist saved')">✓ Done</button></div>`)}function toggleCheck(g,k,b){state.ride[g][k]=!state.ride[g][k];save();b.classList.toggle('checked',state.ride[g][k])}
function openTomorrow(){const n=state.ride.selectedDay<3?DAYS[state.ride.selectedDay+1]:null;openModal(`<div class="modal-head"><div><div class="kicker">PREVIEW</div><h3>Tomorrow</h3><p>${n?`Day ${state.ride.selectedDay+1} • ${n.from} → ${n.to}`:'Final ride day'}</p></div><button class="xbtn" onclick="closeModal()">×</button></div>${n?`<div class="tool-banner"><b>${esc(n.title)}</b><br>${n.tasks.slice(0,5).map(x=>`${x[0]} • ${esc(x[1])}`).join('<br>')}</div>`:'<div class="empty">No next ride day.</div>'}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="closeModal()">✓ Done</button></div>`)}
function openEmergency(){openModal(`<div class="modal-head"><div><div class="kicker">EMERGENCY</div><h3>Emergency actions</h3><p>Simple, immediate actions with up to three custom contacts.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-danger">If there is immediate danger, move to a safe location first. Do not force flooded or washed-out roads.</div><div class="tool-actions"><button class="primary" onclick="location.href='tel:112'">Call 112</button><button class="secondary" onclick="location.href='tel:108'">Ambulance 108</button></div><div class="tool-actions"><button class="secondary" onclick="openNearest('hospital')">Nearest hospital</button><button class="secondary" onclick="openNearest('petrol pump')">Nearest fuel</button></div><button class="secondary full" style="margin-top:8px" onclick="shareLocation()">Share current location</button><div class="section-head" style="margin-top:18px"><div><div class="kicker">CUSTOM</div><h2 style="font-size:14px">Emergency contacts</h2></div></div>${[0,1,2].map(i=>`<div class="field"><label>CONTACT ${i+1}</label><input id="ec${i}" inputmode="tel" placeholder="Name or phone number" value="${esc(state.ride.customEmergency[i]||'')}"></div>`).join('')}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="saveEmergency()">✓ Save contacts</button></div>`)}function saveEmergency(){state.ride.customEmergency=[ec0.value.trim(),ec1.value.trim(),ec2.value.trim()];save();closeModal();toast('Emergency contacts saved')}function openNearest(q){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+' near me'),'_blank','noopener')}async function shareLocation(){if(!navigator.geolocation)return toast('Geolocation is unavailable in this browser');try{if(navigator.permissions){const p=await navigator.permissions.query({name:'geolocation'});if(p.state==='denied'){return alert('Location permission is blocked. Open this site in browser settings, allow Location, then retry.')}}navigator.geolocation.getCurrentPosition(async pos=>{const url=`https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;try{if(navigator.share)await navigator.share({title:'My Rider Hub location',url});else{await navigator.clipboard.writeText(url);toast('Location link copied')}}catch(e){}},err=>{if(err.code===1)alert('Location permission was denied. Allow location for this site and tap Share Current Location again.');else if(err.code===2)alert('Current location is temporarily unavailable. Move to an open area and retry.');else alert('Location request timed out. Retry.')},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}catch(e){toast('Could not request location permission')}}
function openTraffic(){const d=day(),h=new Date().getHours(),cityBusy=(h>=8&&h<=11)||(h>=17&&h<=21);const rows=state.ride.selectedDay===1?[['Home → Odhav / Kuha',cityBusy?'Likely moderate–heavy around Ahmedabad':'Usually lighter outside peak hours'],['Balasinor → Lunawada','Generally flowing; watch monsoon surface conditions'],['Santrampur → Banswara','Rural corridor; rain and visibility matter more than city congestion']]:state.ride.selectedDay===2?[['Banswara urban exits','Usually light early morning'],['Mahi / Ghatol approach','Local traffic can build near market hours'],['Return to Banswara','Expect more local movement late afternoon']]:[['Banswara → Arthuna','Generally light outside town'],['Lunawada / Balasinor','Moderate town traffic possible'],['Odhav → Home',cityBusy?'Ahmedabad peak period likely busy':'City traffic usually manageable outside peak']];openModal(`<div class="modal-head"><div><div class="kicker">IN-APP TRAFFIC</div><h3>Traffic</h3><p>No Google Maps redirect. Live traffic provider is not connected yet, so Rider Hub clearly separates live-unavailable status from route guidance.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-banner"><b>LIVE PROVIDER: NOT CONNECTED</b><br>Current clock: ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}. These are route-specific planning cues, not fake live traffic.</div><div class="tool-list" style="padding:0 12px">${rows.map(r=>`<div class="traffic-row"><b>${r[0]}</b><span>${r[1]}</span><span class="traffic-state">GUIDANCE</span></div>`).join('')}</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="closeModal()">✓ Done</button></div>`)}
function openTransfer(){openModal(`<div class="modal-head"><div><div class="kicker">LOCAL BACKUP</div><h3>Export / import</h3><p>Useful until cloud sync exists.</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-actions"><button class="primary" onclick="exportData()">Export data</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import data</button></div><input id="importFile" type="file" accept="application/json" hidden onchange="importData(this.files[0])"><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="closeModal()">✓ Done</button></div>`)}function exportData(){const b=new Blob([JSON.stringify({format:'RiderHubBackup',version:1,state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='RiderHub_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.format!=='RiderHubBackup'||!x.state)throw 0;if(confirm('Import this Rider Hub backup? Current local progress will be replaced.')){state=x.state;save();closeModal();render();toast('Backup imported')}}catch(e){alert('Invalid Rider Hub backup.')}};r.readAsText(f)}
function openSummary(){const checked=o=>Object.values(o).filter(Boolean).length;openModal(`<div class="modal-head"><div><div class="kicker">RIDE SUMMARY</div><h3>Ride Summary</h3><p>Day ${state.ride.selectedDay} • ${day().from} → ${day().to}</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-summary"><div class="tool-tile"><label>DAY PROGRESS</label><b>${dayProgress()}%</b></div><div class="tool-tile"><label>TRIP PROGRESS</label><b>${tripProgress()}%</b></div><div class="tool-tile"><label>ACTUAL SPENT</label><b>${MONEY(spent())}</b></div></div><div class="tool-list"><div class="tool-row"><div><strong>Fuel logs</strong><small>Recorded stops</small></div><b>${state.ride.fuelLogs.length}</b></div><div class="tool-row"><div><strong>Bike issues</strong><small>Ride issue log</small></div><b>${state.ride.issues.length}</b></div><div class="tool-row"><div><strong>Content tracker</strong><small>Shots completed</small></div><b>${checked(state.ride.content)}/${Object.keys(state.ride.content).length}</b></div><div class="tool-row"><div><strong>Media backup</strong><small>Backup steps complete</small></div><b>${checked(state.ride.backup)}/${Object.keys(state.ride.backup).length}</b></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="closeModal()">✓ Done</button></div>`)}
function openRideMode(){renderRideMode();rideMode.classList.add('open');document.body.style.overflow='hidden'}function closeRideMode(){rideMode.classList.remove('open');document.body.style.overflow=''}function currentTask(){const d=day();let i=d.tasks.findIndex((_,j)=>!['done','skipped'].includes(taskStatus(j)));return i<0?d.tasks.length-1:i}function renderRideMode(){const d=day(),i=currentTask(),t=d.tasks[i],next=d.tasks.slice(i+1).find((_,k)=>!['done','skipped'].includes(taskStatus(i+1+k)));rideModeInner.innerHTML=`<div class="ride-mode-head"><div><div class="mode-label">RIDE MODE • DAY ${state.ride.selectedDay} • ${d.from.toUpperCase()} → ${d.to.toUpperCase()}</div><div class="caption">${dayProgress()}% complete</div></div><button class="round-btn" onclick="closeRideMode()">×</button></div><div class="progress" style="height:4px;margin:6px 0 14px"><i style="width:${dayProgress()}%"></i></div><div class="card now-card"><div class="now-time">${t[0]} • CURRENT</div><h2>${esc(t[1])}</h2><p>${esc(t[2])}</p></div><div class="ride-actions"><button class="done-action" onclick="setTask('done')">Done</button><button class="delay-action" onclick="setTask('delayed')">Delay</button><button class="skip-action" onclick="setTask('skipped')">Skip</button></div><div class="mode-quick"><button onclick="openRoute()">MAP</button><button onclick="openExpenses()">EXPENSES</button><button onclick="openEmergency()">EMERGENCY</button><button onclick="openSummary()">RIDE SUMMARY</button></div><div class="section-head"><div><div class="kicker">CHECKS</div><h2>Pre-ride checks</h2></div></div><div class="card preflight">${[['tyres','Tyres','Pressure, condition and puncture kit'],['luggage','Luggage','Straps, balance and exhaust clearance'],['electronics','Electronics','Phone, offline maps, intercom, Action 5'],['pillion','Pillion essentials','Water, gear fit and rest plan']].map(x=>`<div class="checkrow"><div><strong>${x[1]}</strong><small>${x[2]}</small></div><button class="checkbtn ${state.ride.preflight[x[0]]?'checked':''}" onclick="togglePreflight('${x[0]}')">✓</button></div>`).join('')}</div><div class="section-head"><div><div class="kicker">DAY TIMELINE</div><h2>Schedule</h2></div></div><div class="card day-card"><div class="timeline">${d.tasks.map((x,j)=>taskRow(x,j)).join('')}</div></div>${next?`<div class="card" style="padding:13px"><div class="kicker">NEXT</div><strong style="font-size:11px">${esc(next[1])}</strong><p class="caption">${esc(next[0])} • ${esc(next[2])}</p></div>`:''}`}
function setTask(s){const i=currentTask();if(s==='delayed'){const m=prompt('Delay by how many minutes? This records the delay without shifting all later hard times.','30');if(m===null)return;state.ride.tasks[taskKey(i)]='delayed';state.ride.tasks[taskKey(i)+'_delay']=Math.max(0,Number(m)||0)}else state.ride.tasks[taskKey(i)]=s;save();render();renderRideMode();toast(s==='done'?'Task completed':s==='skipped'?'Task skipped':'Delay recorded')}function togglePreflight(k){state.ride.preflight[k]=!state.ride.preflight[k];save();renderRideMode()}
function openNotifications(){const c=chainKm();openModal(`<div class="modal-head"><div><div class="kicker">NOTIFICATIONS</div><h3>Needs attention</h3></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-list"><div class="tool-row"><div><strong>Chain care</strong><small>${c<400?`${400-c} km until Rider Hub reminder`:c<=500?`${c} km since last care • due by 500 km`:`Overdue by ${c-500} km`}</small></div><span class="tag ${c>500?'due':c>=400?'soon':'good'}">CHAIN</span></div><div class="tool-row"><div><strong>Second service</strong><small>Due at 5,500–6,000 km or 6 months, whichever comes first.</small></div><span class="tag soon">UPCOMING</span></div></div>`)}
function renderDocs(){docs.innerHTML=`<div class="card doc-hero"><div class="kicker">DOCUMENT VAULT</div><h1>Bike + rider documents</h1><p>Sensitive identifiers stay hidden in the preview. Tap a document for its stored summary.</p><div class="doc-summary"><div class="profile-stat"><label>DOCUMENTS</label><b>6</b></div><div class="profile-stat"><label>INSURANCE</label><b>Active</b></div><div class="profile-stat"><label>SERVICE</label><b>1 invoice</b></div></div></div><div class="section-head"><div><div class="kicker">VAULT</div><h2>Stored records</h2></div></div><div class="card">${[['Vehicle invoice','10 Jun 2026 • ₹150,340','✓'],['Lifetime vehicle tax','₹1,693','✓'],['ICICI Lombard insurance','OD to 04 Jun 2027 • TP to 04 Jun 2031','✓'],['Learner licence','02 Jun–01 Dec 2026','✓'],['First service invoice','19 Jun 2026 • 767 km • ₹1,000','✓'],['Hotel Landmark booking','28–30 Aug 2026 • ₹2,470 paid','✓']].map(x=>`<div class="doc-row" onclick="docDetail('${esc(x[0])}','${esc(x[1])}')"><div class="doc-icon">▤</div><div><strong>${x[0]}</strong><p>${x[1]}</p></div><span class="doc-status ok">${x[2]}</span></div>`).join('')}</div>`}function docDetail(n,d){openModal(`<div class="modal-head"><div><div class="kicker">DOCUMENT</div><h3>${n}</h3><p>${d}</p></div><button class="xbtn" onclick="closeModal()">×</button></div><div class="tool-banner">Sensitive identifiers are masked by default in this preview.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Close</button><button class="confirm" onclick="closeModal()">✓ Done</button></div>`)}
render();
</script>
